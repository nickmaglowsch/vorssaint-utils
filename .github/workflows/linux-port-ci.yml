# Copyright (C) 2026 Vorssaint
#
# Gate for the GNU/Linux port (docs/linux-port/). Three jobs, all hard gates:
#   linux-core  the Swift core and the Linux executable compile and run under
#               the official swift:6.1-noble container (the toolchain the
#               WP-00 spike measured).
#   bridge-abi  WP-18's C ABI is real: VorssaintLinux archived as a static
#               library, a C client compiled against
#               linux/shell/include/corebridge.h and nothing else, all four
#               entry points called. Separate from linux-core because it is
#               the only leg that proves something about the *linked* product
#               rather than about the Swift compiler.
#   macos       the macOS product is unchanged: ./build.sh, --selftest, tests,
#               on the same Xcode as ci.yml's compatibility job.
name: Linux port CI

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-commit, not per-branch: several port agents push to the shared
  # integration branch, and a branch-keyed group with cancel-in-progress
  # cancels a green gate run the moment the next agent pushes (observed on
  # run 1, cancelled mid-flight by an unrelated WP-04 commit). Every commit
  # on the branch is a gate and must produce its own verdict.
  group: linux-port-ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  linux-core:
    name: Linux core (Swift 6.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        shell: bash
        run: |
          # The container runs as root over a checkout owned by the runner
          # user; git (and therefore SwiftPM's dependency fetch) refuses that
          # without this.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift --version
          swift --version | grep -F "Swift version 6.1"
          uname -a

      - name: Build VorssaintCore
        shell: bash
        run: swift build --target VorssaintCore

      - name: Build VorssaintCoreTestSupport (Platform fakes)
        shell: bash
        # WP-12 deleted the VorssaintCombine re-export target (COMBINE.md § 7);
        # this step replaces it. It is a real gate, not a formality: this target
        # is the only thing that imports VorssaintCore across a module boundary,
        # so it is what catches a Platform protocol that forgot to be `public`.
        run: swift build --target VorssaintCoreTestSupport

      - name: Build VorssaintLinux
        shell: bash
        run: swift build --target VorssaintLinux

      - name: Run VorssaintLinux
        shell: bash
        run: |
          swift run VorssaintLinux | tee /tmp/vorssaint-linux.out
          grep -F "VorssaintCore 0.1.0-dev (linux)" /tmp/vorssaint-linux.out

      # Before the tests, so the job log ends with the test summary: the API
      # only serves the tail of a 1600-line log, and apt's progress output
      # would otherwise bury it.
      - name: The generated tests are what the generator produces
        shell: bash
        run: |
          command -v python3 >/dev/null \
            || (apt-get update -qq >/dev/null && apt-get install -y -qq python3 >/dev/null)
          # Hard gate: every emitted file resolves and is balanced.
          python3 Tools/linux-port/port-tests.py --verify
          # Drift is reported, not failed: every core move (WP-12 and the
          # feature squads) legitimately enlarges the selection, and the file
          # to regenerate belongs to whoever moves next, not to the push that
          # happens to land after them. A hand edit shows up here too —
          # the tool overwrites Generated*.swift on the next run.
          python3 Tools/linux-port/port-tests.py
          if ! git diff --quiet -- Tests/VorssaintCoreTests; then
            echo "::warning::Tests/VorssaintCoreTests is stale — run" \
                 "python3 Tools/linux-port/port-tests.py and commit the result"
            git diff --stat -- Tests/VorssaintCoreTests
          fi
          git checkout -- Tests/VorssaintCoreTests

      - name: The generated tables match their sources
        shell: bash
        # Hard gates, both of them: a key added to DefaultsKeys.swift without
        # the inventory would fall out of WP-14's round-trip test silently, and
        # a case added to AppFeature without FeatureSupportCatalog would leave
        # the hub with a feature whose Linux support nobody decided (WP-15).
        # Neither is something the compiler can catch: FeatureCatalog.swift is
        # in the Mac layer, and Swift cannot enumerate an enum's statics.
        run: |
          command -v python3 >/dev/null \
            || (apt-get update -qq >/dev/null && apt-get install -y -qq python3 >/dev/null)
          python3 Tools/linux-port/defaults-inventory.py --verify
          python3 Tools/linux-port/check-feature-catalog.py

      - name: Unit tests
        shell: bash
        run: |
          # The pure checks of the macOS `build.sh --test` harness, selected by
          # Tools/linux-port/port-tests.py and committed under
          # Tests/VorssaintCoreTests (WP-16, docs/linux-port/TESTS.md).
          # pipefail, or `| tee` would swallow a failing exit status and the
          # grep below would happily match one green suite line out of many.
          # -suppress-warnings: the generated cases carry the original
          # harness's unused bindings, and 24 000 warning lines bury the one
          # message that matters in a log that can only be read from the end.
          set -o pipefail
          status=0
          swift test --filter VorssaintCoreTests -Xswiftc -suppress-warnings \
            2>&1 | tee /tmp/swift-test.out || status=$?
          echo "=== errors, if any ==============================="
          grep -E "error:" /tmp/swift-test.out | head -40 || true
          echo "=== per-case check counts ========================"
          grep -F "[generated-checks]" /tmp/swift-test.out | tail -100 || true
          echo "=== the WP-18 diffing measurement ================"
          # docs/linux-port/BRIDGE.md quotes these lines; they are the
          # measurement the full-snapshot decision rests on, so they are
          # re-made on every run rather than copied from a report.
          grep -F "[bridge-diff]" /tmp/swift-test.out || true
          echo "=== totals ======================================="
          # corelibs-xctest indents the summary with a tab, so anchor loosely.
          grep -E "Executed [0-9]+ tests?" /tmp/swift-test.out | tail -5 || true
          test "$status" -eq 0
          grep -qE "Executed [0-9]+ tests?, with 0 failures" /tmp/swift-test.out
          ! grep -qE "with [1-9][0-9]* failures?" /tmp/swift-test.out

  bridge-abi:
    name: Bridge C ABI (static library + C client)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift --version | grep -F "Swift version 6.1"
          # swift:6.1-noble ships clang and binutils but no `cc` symlink, so
          # resolve each tool once here rather than assuming a name.
          for candidate in clang gcc cc; do
            if command -v "$candidate" >/dev/null; then CC="$candidate"; break; fi
          done
          for candidate in ar llvm-ar; do
            if command -v "$candidate" >/dev/null; then AR="$candidate"; break; fi
          done
          for candidate in nm llvm-nm; do
            if command -v "$candidate" >/dev/null; then NM="$candidate"; break; fi
          done
          : "${CC:?no C compiler}" "${AR:?no ar}" "${NM:?no nm}"
          "$CC" --version | head -1
          { echo "CC=$CC"; echo "AR=$AR"; echo "NM=$NM"; } >> "$GITHUB_ENV"

      # The proof that the header is the same ABI the WP-01 Qt spike was built
      # against. Comment lines start with `/*`, ` *` or ` */` and are dropped;
      # what is left is every declaration and every preprocessor line, and the
      # two files must agree on all of it byte for byte. The prose above the
      # include guard differs deliberately (docs/linux-port/BRIDGE.md § 3).
      - name: The header declares the same ABI as the WP-01 stub
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(#|typedef|int |char |void |extern|\})'
          grep -E "$pattern" spikes/wp01-toolkit/corebridge-stub/corebridge.h > /tmp/stub.decls
          grep -E "$pattern" linux/shell/include/corebridge.h > /tmp/real.decls
          echo "=== linux/shell/include/corebridge.h, declarations only ==="
          cat /tmp/real.decls
          diff -u /tmp/stub.decls /tmp/real.decls
          echo "HEADER DECLARATIONS IDENTICAL"

      # LinuxFeatureProbeSet sits on the wrong side of a module boundary from
      # AppFeature (still macOS-only until WP-15), so the compiler cannot check
      # that its ids are real. A grep can.
      - name: Every feature id the bridge offers is a real AppFeature
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^enum AppFeature/,/^}/p' Sources/Vorssaint/Core/FeatureCatalog.swift \
            | sed 's://.*::' | grep -E '^\s*(case )?[a-z]' | tr ' ,' '\n\n' \
            | grep -E '^[a-z][A-Za-z0-9]*$' | grep -v '^case$' | sort -u \
            > /tmp/appfeatures.txt
          test "$(wc -l < /tmp/appfeatures.txt)" -gt 40  # the catalog really parsed
          sed -n '/public static let ids = \[/,/^    \]/p' \
            Sources/VorssaintCore/Bridge/BridgeStandardServices.swift \
            | grep -oE '"[a-zA-Z]+"' | tr -d '"' | sort -u > /tmp/probeset.txt
          test -s /tmp/probeset.txt
          missing=$(comm -23 /tmp/probeset.txt /tmp/appfeatures.txt || true)
          if [ -n "$missing" ]; then
            echo "not AppFeature cases: $missing"; exit 1
          fi
          echo "ALL PROBE-SET IDS ARE APPFEATURE CASES"
          cat /tmp/probeset.txt | tr '\n' ' '; echo

      - name: Build VorssaintLinux
        shell: bash
        run: swift build --target VorssaintLinux

      # "VorssaintLinux as a static library": SwiftPM builds executables, not
      # archives, so the archive is made from the objects it produced —
      # VorssaintCore, VorssaintLinux (minus main.swift.o, whose `main` the C
      # client brings its own of) and the OpenCombine products the core needs
      # on Linux. nm is the check that the four @_cdecl symbols are really
      # exported, undecorated, from the archive itself.
      - name: Archive it as a static library
        shell: bash
        run: |
          set -euo pipefail
          # `.build/debug` is a symlink into `.build/<triple>/debug`, and find
          # does not follow one, so ask SwiftPM where it actually put things
          # rather than guessing (run 34714270680 found zero objects that way).
          bin=$(swift build --target VorssaintLinux --show-bin-path)
          echo "bin path: $bin"
          objects=$(find "$bin" -name '*.o' -path '*.build/*' \
            \( -path '*VorssaintCore.build*' -o -path '*VorssaintLinux.build*' \
               -o -path '*OpenCombine*' \) ! -name 'main.swift.o' | sort)
          if [ -z "$objects" ]; then
            echo "no object files under $bin; what is there:"
            find "$bin" -maxdepth 2 | head -40
            exit 1
          fi
          echo "$objects" | wc -l | xargs echo "object files:"
          echo "$objects" > /tmp/objects.txt
          "$AR" crs /tmp/libvorssaintbridge.a $objects
          ls -l /tmp/libvorssaintbridge.a
          echo "=== exported bridge symbols ==="
          "$NM" --defined-only -g /tmp/libvorssaintbridge.a \
            | grep -E ' T (vs_subscribe|vs_command|vs_snapshot|vs_free)$' | sort
          for symbol in vs_subscribe vs_command vs_snapshot vs_free; do
            "$NM" --defined-only -g /tmp/libvorssaintbridge.a \
              | grep -qE " T $symbol\$" || { echo "missing $symbol"; exit 1; }
          done
          echo "ALL FOUR SYMBOLS EXPORTED"

      # The client includes linux/shell/include/corebridge.h and nothing else,
      # and is compiled as C with -Werror: a signature the header gets wrong is
      # a compile error here, and a symbol it names wrongly is a link error.
      - name: Compile the C client against the header alone
        shell: bash
        run: |
          set -euo pipefail
          "$CC" -std=c11 -Wall -Wextra -Werror -O2 \
            -I linux/shell/include -c linux/shell/tests/abi_client.c \
            -o /tmp/abi_client.o
          echo "C CLIENT COMPILED"

      # swiftc is the linker driver because the Swift runtime's autolink
      # entries live in those objects; `swift-autolink-extract` is what turns
      # them into -l flags, and it reads objects rather than archives, so it is
      # run over the object list and the archive is what is actually linked.
      - name: Link it against the static library and run it
        shell: bash
        run: |
          set -euo pipefail
          swift-autolink-extract $(cat /tmp/objects.txt) -o /tmp/autolink.args
          echo "=== autolink flags ==="
          tr '\n' ' ' < /tmp/autolink.args; echo
          # shellcheck disable=SC2046
          swiftc -o /tmp/vs-abi-client /tmp/abi_client.o /tmp/libvorssaintbridge.a \
            -L "$(swift build --target VorssaintLinux --show-bin-path)" \
            $(tr '\n' ' ' < /tmp/autolink.args)
          echo "=== what it links against ==="
          ldd /tmp/vs-abi-client | head -20
          echo "=== running the C client ==="
          set -o pipefail
          /tmp/vs-abi-client 2>&1 | tee /tmp/abi.out
          grep -q '^OK: 0 check(s) failed' /tmp/abi.out
          ! grep -q '\[FAIL\]' /tmp/abi.out

  macos:
    name: macOS app (build.sh)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Unit tests
        run: ./build.sh --test

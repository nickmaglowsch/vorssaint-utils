#
# WP-00 spike: the only place a Linux Swift compiler is reachable. This
# workflow is evidence-gathering, not a gate — every build step is
# continue-on-error so the log is always produced and the branch never fails
# because the spike does not compile yet.
#
# The raw `swift build` output goes to a file that is uploaded as an artifact,
# NOT to the job log. Teeing it into the job log was tried first and made the
# log unreadable through the Actions API: the failing targets produce tens of
# thousands of diagnostic lines and the API only ever returns the tail. The
# job log therefore carries the classified census instead.

name: linux-spike-wp00

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # The container's default shell is `sh`, which has no ${PIPESTATUS[@]}.
    shell: bash

jobs:
  swift-6-1:
    name: swift 6.1 (noble)
    runs-on: ubuntu-24.04
    container:
      image: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: swift --version
        run: |
          swift --version
          uname -a
          head -3 /etc/os-release

      - name: sync vendored sources
        working-directory: spikes/wp00-swift-core
        run: |
          ./sync.sh
          echo "core candidate set: $(ls Sources/VorssaintCoreSpike/Vendored | wc -l) files"
          echo "full census set:    $(ls Sources/VorssaintCoreWide/Vendored | wc -l) files"
          echo "non-UI service set: $(ls Sources/VorssaintServices/Vendored | wc -l) files"
          echo "minimal set:        $(ls minimal/Sources/VorssaintCoreMinimal/Vendored | wc -l) files"

      - name: resolve dependencies (OpenCombine)
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          swift package resolve
          cat Package.resolved

      - name: build VorssaintCoreSpike (core candidate set, 103 files)
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift build --target VorssaintCoreSpike > build.log 2>&1
          echo "swift build exit=$?"
          ./classify-errors.sh build.log

      - name: build VorssaintCoreWide (all 120 census files)
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift build --target VorssaintCoreWide > build-wide.log 2>&1
          echo "swift build exit=$?"
          ./classify-errors.sh build-wide.log

      - name: build VorssaintServices (the whole non-UI layer, 208 files)
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift build --target VorssaintServices > build-services.log 2>&1
          echo "swift build exit=$?"
          ./classify-errors.sh build-services.log

      - name: static link probe (--static-swift-stdlib) + ldd
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift build -c release --static-swift-stdlib --product hello-spike 2>&1 | tail -20
          bin="$(swift build -c release --static-swift-stdlib --product hello-spike --show-bin-path)/hello-spike"
          echo "--- binary ---"
          ls -l "$bin"
          echo "--- run ---"
          "$bin"
          echo "--- ldd ---"
          ldd "$bin"
          echo "--- dynamic swift/Foundation/icu libraries still referenced ---"
          ldd "$bin" | grep -iE 'swift|foundation|icu|curl|xml' || echo "(none)"
          echo "--- size ---"
          du -h "$bin"

      - name: build + test the minimal package (URLCleaning, CommandBarMath)
        working-directory: spikes/wp00-swift-core/minimal
        continue-on-error: true
        run: |
          set +e
          swift build 2>&1 | tail -30
          echo "swift build exit=${PIPESTATUS[0]}"
          swift test 2>&1 | tail -60
          echo "swift test exit=${PIPESTATUS[0]}"

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp00-swift-6.1-logs
          path: |
            spikes/wp00-swift-core/*.log
            spikes/wp00-swift-core/Package.resolved
          if-no-files-found: warn

  swift-6-2-nightly:
    name: swift 6.2 nightly (noble)
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: swiftlang/swift:nightly-6.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: swift --version
        continue-on-error: true
        run: swift --version

      - name: sync vendored sources
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: ./sync.sh

      - name: build the same targets
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift build --target VorssaintCoreSpike > build-62.log 2>&1
          echo "core candidate exit=$?"
          ./classify-errors.sh build-62.log
          swift build --target VorssaintServices > build-services-62.log 2>&1
          echo "services exit=$?"
          ./classify-errors.sh build-services-62.log

      - name: build + test the minimal package
        working-directory: spikes/wp00-swift-core/minimal
        continue-on-error: true
        run: |
          set +e
          swift test 2>&1 | tail -60
          echo "swift test exit=${PIPESTATUS[0]}"

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp00-swift-6.2-logs
          path: spikes/wp00-swift-core/*.log
          if-no-files-found: warn

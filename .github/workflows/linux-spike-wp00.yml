#
# WP-00 spike: the only place a Linux Swift compiler is reachable. This
# workflow is evidence-gathering, not a gate — every build step is
# continue-on-error so the log is always produced and the branch never fails
# because the spike does not compile yet.

name: linux-spike-wp00

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # The container's default shell is `sh`; the steps use bash arrays
    # (PIPESTATUS) and process substitution.
    shell: bash

jobs:
  swift-6-1:
    name: swift 6.1 (noble)
    runs-on: ubuntu-24.04
    container:
      image: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: swift --version
        run: |
          swift --version
          uname -a
          head -3 /etc/os-release

      - name: sync vendored sources
        working-directory: spikes/wp00-swift-core
        run: |
          ./sync.sh
          echo "core candidate set: $(ls Sources/VorssaintCoreSpike/Vendored | wc -l) files"
          echo "full census set:    $(ls Sources/VorssaintCoreWide/Vendored | wc -l) files"

      - name: resolve dependencies (OpenCombine)
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          swift package resolve 2>&1 | tee resolve.log
          cat Package.resolved || true

      - name: build VorssaintCoreSpike (core candidate set)
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift build -v --target VorssaintCoreSpike 2>&1 | tee build.log
          echo "swift build exit=${PIPESTATUS[0]}"
          ./classify-errors.sh build.log

      - name: build VorssaintCoreWide (all 120 census files)
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift build -v --target VorssaintCoreWide 2>&1 | tee build-wide.log
          echo "swift build exit=${PIPESTATUS[0]}"
          ./classify-errors.sh build-wide.log

      - name: static link probe (--static-swift-stdlib) + ldd
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift build -c release --static-swift-stdlib --product hello-spike 2>&1 | tee static.log
          bin="$(swift build -c release --static-swift-stdlib --product hello-spike --show-bin-path)/hello-spike"
          echo "--- binary ---"
          ls -l "$bin"
          echo "--- run ---"
          "$bin"
          echo "--- ldd ---"
          ldd "$bin"
          echo "--- dynamic swift/Foundation libraries still referenced ---"
          ldd "$bin" | grep -iE 'swift|foundation|icu|curl|xml' || echo "(none)"
          echo "--- size ---"
          du -h "$bin"

      - name: swift test (URLCleaning + CommandBarMath)
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift test 2>&1 | tee test.log
          echo "swift test exit=${PIPESTATUS[0]}"
          grep -E "Test Suite|Executed [0-9]+ test|error:" test.log | tail -40

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp00-swift-6.1-logs
          path: |
            spikes/wp00-swift-core/*.log
            spikes/wp00-swift-core/Package.resolved
          if-no-files-found: warn

  swift-6-2-nightly:
    name: swift 6.2 nightly (noble)
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: swiftlang/swift:nightly-6.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: swift --version
        continue-on-error: true
        run: swift --version

      - name: sync vendored sources
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: ./sync.sh

      - name: build both targets
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift build -v --target VorssaintCoreSpike 2>&1 | tee build-62.log
          echo "core candidate exit=${PIPESTATUS[0]}"
          ./classify-errors.sh build-62.log
          swift build -v --target VorssaintCoreWide 2>&1 | tee build-wide-62.log
          echo "wide exit=${PIPESTATUS[0]}"
          ./classify-errors.sh build-wide-62.log

      - name: swift test
        working-directory: spikes/wp00-swift-core
        continue-on-error: true
        run: |
          set +e
          swift test 2>&1 | tee test-62.log
          echo "swift test exit=${PIPESTATUS[0]}"
          grep -E "Test Suite|Executed [0-9]+ test|error:" test-62.log | tail -40

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp00-swift-6.2-logs
          path: spikes/wp00-swift-core/*.log
          if-no-files-found: warn

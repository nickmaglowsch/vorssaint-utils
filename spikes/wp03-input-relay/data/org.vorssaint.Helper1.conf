<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!--
    System-bus policy for the Vorssaint input helper. Installed to
    /usr/share/dbus-1/system.d/org.vorssaint.Helper1.conf.

    This file is the first of two gates. It decides who may *talk* to the
    helper at all; polkit then decides, per method, who may make it act. The
    bus gate is cheap and unbypassable, so it carries the coarse rule: only
    root may own the name, so no unprivileged process can impersonate the
    helper and harvest the rules an app sends it.
  -->

  <policy user="root">
    <allow own="org.vorssaint.Helper1"/>
  </policy>

  <policy context="default">
    <!-- Any local user may call the interface; polkit decides the outcome.
         Sending is allowed rather than denied so the helper can return a
         proper AccessDenied that a UI can explain, instead of the bus
         rejecting the message with no context. -->
    <allow send_destination="org.vorssaint.Helper1"
           send_interface="org.vorssaint.Helper1"/>
    <allow send_destination="org.vorssaint.Helper1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.vorssaint.Helper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>

    <!-- Nothing else. In particular, no ownership of the name. -->
    <deny own="org.vorssaint.Helper1"/>
  </policy>

</busconfig>
